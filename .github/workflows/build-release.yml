name: Build and release

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Windows x64)
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DSIMAGICFIX_BUILD_GUI=ON `
            -DLMU_SDK_DIR="${{ github.workspace }}/third_party/lmu_sdk"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Self test
        shell: pwsh
        run: |
          $out = & .\build\Release\SimagicFixCLI.exe selftest
          $out | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "selftest failed" }

      - name: Mock telemetry test
        shell: pwsh
        run: |
          $mock = Start-Process -FilePath ".\build\Release\SimagicFixCLI.exe" `
            -ArgumentList "mock-shm","10" -PassThru
          Start-Sleep -Seconds 2
          $out = & .\build\Release\SimagicFixCLI.exe probe
          $out | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "probe failed" }
          if (-not ($out -match "Mock Hypercar")) { throw "mock LMU_Data was not read" }
          $mock.WaitForExit()

      - name: Package
        id: package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '[^A-Za-z0-9._-]', '-'
          if (-not $tag.StartsWith("v")) { $tag = "dev-${{ github.run_number }}" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Path @(
            "build\Release\SimagicFix.exe",
            "build\Release\SimagicFixCLI.exe",
            "build\Release\SimagicFixHook.dll",
            "README.md",
            "LICENSE",
            "THIRD_PARTY_NOTICES.md",
            "docs\VALIDATION.md"
          ) -Destination dist
          $zip = "SimagicFix-$tag-win64.zip"
          Compress-Archive -Path dist\* -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          "$hash  $zip" | Set-Content "$zip.sha256"
          "zip_name=$zip" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: SimagicFix-${{ github.run_number }}
          path: |
            SimagicFix-*.zip
            SimagicFix-*.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: SimagicFix-${{ github.run_number }}
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
