name: CodeQL

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (C/C++)
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg-cache,readwrite'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      # Configure first: vcpkg installs the dependencies here, before CodeQL
      # starts tracing the build, so dependency sources are not analyzed.
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build-codeql -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DSIMAGICFIX_BUILD_GUI=ON

      # The project only builds with MSVC (Win32 API, .rc resources), so CodeQL
      # cannot autobuild it and the build is driven manually below.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          # Security focus: quality/maintainability queries are covered by the
          # /analyze and cppcheck jobs.
          queries: security-extended

      - name: Build
        shell: pwsh
        run: cmake --build build-codeql --config Release --parallel

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-cpp"
