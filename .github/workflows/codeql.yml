name: CodeQL

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (C/C++)
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The project only builds with MSVC (Win32 API, .rc resources), so CodeQL
      # cannot autobuild it and the build is driven manually below.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build-codeql -G "Visual Studio 17 2022" -A x64 `
            -DSIMAGICFIX_BUILD_GUI=ON `
            -DLMU_SDK_DIR="${{ github.workspace }}/third_party/lmu_sdk"

      - name: Build
        shell: pwsh
        run: cmake --build build-codeql --config Release --parallel

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-cpp"
